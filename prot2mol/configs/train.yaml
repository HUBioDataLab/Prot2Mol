train:
  dataset_path: ../../dataset/cache/prot2mol/chembl_37_mmseqs50_generation_esm2

  prot_emb_model: esm2
  protein_model_id: facebook/esm2_t33_650M_UR50D
  decoder_model_id: zjunlp/MolGen-large
  conditioning_dropout: 0.1
  max_mol_len: 256
  prot_max_length: 1024

  epoch: 10
  learning_rate: 1.0e-5
  train_batch_size: 4
  valid_batch_size: 8
  gradient_accumulation_steps: 1
  dataloader_num_workers: 4
  weight_decay: 0.01
  max_grad_norm: 1.0
  precision: auto
  logging_steps: 50
  training_mode: single_gpu
  split_seed: 42

  train_encoder_model: false
  train_projection_model: true
  train_decoder_model: true

  generation_eval_proteins: 32
  generation_samples_per_protein: 4
  generation_train_reference_limit: 10000

  save_dir: ../../outputs/prot2mol
  run_name_suffix: null
  log_level: INFO
  resume_from_checkpoint: null
  load_pretrained_model: null
