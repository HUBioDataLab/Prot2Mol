train:
  selfies_path: ./data/papyrus/prot_comp_set_pchembl_6_protlen_1000_human_False.csv
  prot_emb_model: saprot
  n_layer: 1
  n_head: 16
  n_emb: 1024
  max_mol_len: 200
  prot_max_length: 1000

  epoch: 50
  learning_rate: 1.0e-5
  train_batch_size: 4
  valid_batch_size: 4
  gradient_accumulation_steps: 1
  dataloader_num_workers: 4
  weight_decay: 0.01
  training_mode: auto
  eval_split: random
  eval_split_ratio: 0.01
  split_seed: 42
  pchembl_huber_delta: 1.0

  train_encoder_model: false
  train_decoder_model: false
  train_pchembl_head: true
  stop_pchembl_gradients: true

  save_dir: /gpfs/projects/etur29/atabey/saved_models
  run_name_suffix: null
  log_level: INFO
  resume_from_checkpoint: null
  load_pretrained_model: null
  ignore_mismatched_optimizer: false
