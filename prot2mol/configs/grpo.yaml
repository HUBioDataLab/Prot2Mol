grpo:
  # Unique plain protein sequences are derived directly from this training split.
  train_parquet_path: ../../dataset/processed/chembl_37/target_aware_random_assay_activity_balanced/train.parquet
  validation_parquet_path: ../../dataset/processed/chembl_37/target_aware_random_assay_activity_balanced/val.parquet
  protein_id_column: protein_accession
  protein_sequence_column: protein_sequence
  smiles_column: smiles
  label_column: binary_label

  # Required for FusionDTI. The random-assay files do not contain this column.
  # The mapping must contain protein_accession + structure_aware_sequence, where
  # structure_aware_sequence is the SaProt residue/3Di paired string.
  structure_aware_path: ../../dataset/processed/chembl_37/target_aware_random_assay_activity_balanced/structure_aware_proteins.parquet
  structure_aware_key_column: protein_accession
  structure_aware_sequence_column: structure_aware_sequence

  generator_checkpoint: ../../models/prot_comp_set_pchembl_6_protlen_1000_human_False_emb_esm2_dec_gpt_lr_5e-05_bs_6_layers_12_heads_16_20250706_235311
  prot_emb_model: esm2
  protein_model_id: facebook/esm2_t33_650M_UR50D
  protein_model_revision: 08e4846e537177426273712802403f7ba8261b6c
  decoder_type: gpt2
  decoder_model_id: zjunlp/MolGen-large
  decoder_model_revision: 3c6e8fb91a783853a3782552a85efc4df6f96d0a
  n_layer: 12
  n_head: 16
  n_emb: 1280
  conditioning_dropout: 0.1
  models_base: null
  max_mol_len: 200
  min_mol_len: 3
  prot_max_length: 1000
  # Decoder-only is the memory-efficient default. Enable to optimize the
  # protein encoder and conditioning projection with a fully copied reference.
  train_policy_encoder: false
  # These can be selected independently for conditioning-only ablations.
  train_policy_projection: false
  train_policy_decoder: true
  decoder_train_scope: full
  # These July 2025 GPT-2 checkpoints were trained on fixed-width left-padded
  # molecule rows and historically sampled from PAD token 1.
  generation_start_mode: legacy_pad

  reward_backend: fusiondti
  internal_reward_model_path: null
  fusiondti_dataset: BindingDB
  reward_batch_size: 8
  reward_max_length: 512
  # FusionDTI adds CLS/EOS, so 510 residues is its strict no-truncation limit.
  reward_protein_max_residues: 510
  reward_protein_cache_size: 64
  activity_probability_threshold: 0.5
  # Optional decision-boundary bonus. Zero preserves pure probability reward.
  activity_threshold_bonus_weight: 0.0
  # Shape FusionDTI activity with target-specific training-active chemistry.
  # LogP is unpenalized inside mean +/- 2 std; SAS is unpenalized below
  # mean + 2 std. Heavy atoms use a soft target-specific mean +/- 2 std
  # guardrail with at most a 15% reward reduction.
  property_reward_shaping: true
  property_allowed_sigma: 2.0
  property_penalty_strength: 0.5
  qed_lower_quantile: 0.1
  qed_penalty_strength: 0.0
  heavy_atom_penalty_weight: 0.15
  # Continuously reward each molecule's contribution to group diversity using
  # equal mean and nearest-neighbor Morgan/Tanimoto weights. The factor is
  # (1 - reward_weight) + reward_weight * (1 - combined_similarity).
  # Canonical duplicates get zero reward.
  diversity_reward_shaping: true
  diversity_reward_weight: 0.5
  diversity_mean_similarity_weight: 0.5
  diversity_duplicate_penalty_factor: 0.0
  diversity_morgan_radius: 2
  diversity_morgan_bits: 2048
  local_files_only: false

  # One rollout = one unique protein x sixteen generated molecules; the rollout
  # is reused for num_iterations decoder optimizer updates.
  epochs: 20
  max_steps: null
  lr_schedule_steps: null
  protein_batch_size: 1
  group_size: 16
  learning_rate: 1.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.03
  clip_epsilon: 0.2
  kl_beta: 0.01
  advantage_epsilon: 1.0e-6
  # Reuse each rollout once after the first update so PPO clipping is active.
  num_iterations: 2
  loss_type: grpo
  max_grad_norm: 1.0
  temperature: 1.0
  top_p: 0.9
  precision: bf16
  seed: 42
  device: cuda
  train_on_evaluation_panel_only: true

  # Fixed-seed baseline at step 0, then periodic target-conditional evaluation.
  # Forty proteins x 64 generations gives 2,560 molecules per endpoint.
  evaluation_only: false
  eval_at_start: true
  eval_steps: 500
  eval_proteins: 40
  # Fixed seed-42 cohort: AKT1, CDK2, then 38 eligible random proteins.
  eval_protein_ids:
    - P31749
    - P24941
    - Q15118
    - Q9BY41
    - P21917
    - P45452
    - Q13547
    - P32245
    - P00797
    - P00746
    - P00742
    - P49682
    - P36897
    - O43570
    - P28482
    - P49761
    - P41144
    - P28223
    - P56817
    - Q96RI0
    - Q16539
    - Q9NWZ3
    - P41143
    - Q99705
    - O15552
    - P11802
    - P43490
    - P06239
    - Q60492
    - P21554
    - P11309
    - P34972
    - Q05941
    - P61169
    - P35414
    - Q96RI1
    - P35348
    - P0DMS8
    - O14757
    - P56373
  # Only these two get individual scalar plots; all 40 stay in one W&B table.
  wandb_target_metric_ids:
    - P31749
    - P24941
  eval_samples_per_protein: 64
  eval_generation_batch_size: 128
  eval_seed: 17
  # Strictly more than 200 unique active validation molecules.
  min_fcd_reference_actives: 201
  fcd_batch_size: 256
  fcd_num_workers: 1
  fcd_model_path: null

  output_dir: ../../outputs/prot2mol-grpo/esm2-legacy-hac-g16-20ep
  resume_from_checkpoint: null
  logging_steps: 1
  # The server has room for checkpoints 200/400 plus the final model while
  # preserving the previous ablation run.
  save_steps: 200
  save_final_checkpoint: true
  wandb_project: prot2mol-grpo
  wandb_entity: null
  wandb_run_name: esm2-legacy-hac-g16-20ep
  wandb_mode: online
  log_level: INFO
