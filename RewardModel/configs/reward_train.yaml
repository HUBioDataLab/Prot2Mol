model:
  protein_model_name_or_path: facebook/esm2_t12_35M_UR50D
  molecule_model_name_or_path: HUBioDataLab/SELFormer
  protein_max_length: 1024
  molecule_max_length: 256
  fusion_hidden_dim: 512
  fusion_num_heads: 8
  fusion_attention_backend: sdpa
  fusion_residual: true
  dropout: 0.1
  pooling_type: mean
  pair_scoring_mode: scaled_cosine
  cosine_scale_init: 13.0
  cosine_scale_max: 100.0
  cosine_classification_bias_init: 0.0
  activity_threshold: 6.0
  ranking_loss_weight: 1.0
  classification_loss_weight: 1.0
  ranking_temperature: 1.0
  ranking_affinity_margin: 0.47712125472
  ranking_min_pchembl_span: 0.5
  bce_pos_weight: 1.0
  deduplicate_protein_inputs: true
  deduplicate_molecule_inputs: true
  freeze_protein_encoder: true
  freeze_molecule_encoder: true

data:
  train_parquet_path: ../../dataset/processed/chembl_37/protein_cluster_50_activity_balanced/train.parquet
  val_parquet_path: ../../dataset/processed/chembl_37/protein_cluster_50_activity_balanced/val.parquet
  test_parquet_path: ../../dataset/processed/chembl_37/protein_cluster_50_activity_balanced/test.parquet
  tokenized_dataset_dir: ../reward_model/data/tokenized/chembl_37_mmseqs50_activity_balanced
  tokenization_batch_size: 64
  ranking_max_ligands: 16
  ranking_opportunity_divisor: 32
  evaluation_ranking_partitions: 3
  ranking_min_pchembl_span: 0.5
  max_classification_only_per_item: 16

training:
  output_dir: ../outputs/chembl_37_mmseqs50_activity_balanced_scaled_cosine_1000_steps
  num_train_epochs: 10
  max_steps: 1000
  per_device_train_batch_size: 48
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  eval_steps: 1000
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 10
  dataloader_num_workers: 0
  dynamic_padding: true
  length_bucketing: true
  length_bucket_size_multiplier: 50
  seed: 42
  fp16: true
  optim: adamw_torch_fused
  save_safetensors: false
  save_total_limit: 2
  training_mode: single_gpu
  ranking_score_diagnostics: true
  report_to:
    - wandb
