model:
  protein_model_name_or_path: facebook/esm2_t12_35M_UR50D
  molecule_model_name_or_path: HUBioDataLab/SELFormer
  protein_max_length: 1024
  molecule_max_length: 256
  fusion_hidden_dim: 512
  fusion_num_heads: 8
  dropout: 0.1
  pooling_type: mean
  activity_threshold: 6.0
  pair_loss_weight: 1.0
  classification_loss_weight: 0.5
  bce_pos_weight: 1.0
  deduplicate_protein_inputs: true
  deduplicate_molecule_inputs: true

data:
  train_parquet_path: ../../../dummy/train.parquet
  val_parquet_path: ../../../dummy/val.parquet
  test_parquet_path: ../../../dummy/test.parquet
  tokenized_dataset_dir: ../reward_model/data/tokenized/reward_train_examples
  tokenization_batch_size: 64

training:
  output_dir: ../outputs/reward_train
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 10
  eval_steps: 879326
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 10
  dataloader_num_workers: 0
  dynamic_padding: true
  length_bucketing: true
  length_bucket_size_multiplier: 50
  seed: 42
  fp16: true
  save_safetensors: false
  save_total_limit: 2
  training_mode: single_gpu
  report_to: []
