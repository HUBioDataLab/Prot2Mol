model:
  protein_model_name_or_path: facebook/esm2_t12_35M_UR50D
  molecule_model_name_or_path: HUBioDataLab/SELFormer
  protein_max_length: 256
  molecule_max_length: 128
  fusion_hidden_dim: 128
  fusion_num_heads: 4
  fusion_attention_backend: sdpa
  dropout: 0.1
  pooling_type: mean
  activity_threshold: 6.0
  ranking_loss_weight: 1.0
  classification_loss_weight: 1.0
  ranking_temperature: 1.0
  ranking_min_pchembl_span: 0.5
  bce_pos_weight: 1.0
  deduplicate_protein_inputs: true
  deduplicate_molecule_inputs: true

data:
  train_parquet_path: ../../../dummy/train.parquet
  val_parquet_path: ../../../dummy/val.parquet
  test_parquet_path: ../../../dummy/test.parquet
  tokenized_dataset_dir: ../reward_model/data/tokenized/reward_train_examples_demo_10k
  tokenization_batch_size: 16
  ranking_max_ligands: 16
  ranking_opportunity_divisor: 32
  ranking_min_pchembl_span: 0.5
  max_classification_only_per_item: 16

training:
  output_dir: ../outputs/train_10k_08_06_2026
  num_train_epochs: 10
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  eval_steps: 125
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 1
  dataloader_num_workers: 0
  dynamic_padding: true
  length_bucketing: true
  length_bucket_size_multiplier: 50
  seed: 42
  fp16: true
  optim: adamw_torch_fused
  save_safetensors: false
  save_total_limit: 1
  training_mode: single_gpu
  report_to:
    - wandb
